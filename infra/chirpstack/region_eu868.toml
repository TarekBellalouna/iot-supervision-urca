# Configuration de la bande de fréquences EU868

[[regions]]
  id="eu868"
  description="EU868"
  common_name="EU868"

  [regions.network]
    installation_margin=10
    rx1_delay=1
    rx1_dr_offset=0
    rx2_dr=0
    rx2_frequency=869525000

  [regions.gateway]
    force_gws_private=false

    [regions.gateway.backend]
      enabled="mqtt"

      [regions.gateway.backend.mqtt]
        topic_prefix="eu868"
        server="tcp://mosquitto:1883"
        username="chirpstack"
        password="$MQTT_CHIRPSTACK_PASSWORD"
        clean_session=true